name: ${COMPOSE_PROJECT_NAME:-school-guestbook}

services:
  nginx:
    image: nginx:1.29-alpine
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [guestbook]
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Buku Tamu Sekolah}
        NEXT_PUBLIC_CAMERA_FACING_MODE: ${NEXT_PUBLIC_CAMERA_FACING_MODE:-user}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Buku Tamu Sekolah}
      NEXT_PUBLIC_CAMERA_FACING_MODE: ${NEXT_PUBLIC_CAMERA_FACING_MODE:-user}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [guestbook]
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      AI_SERVICE_URL: http://insightface-service:8000
      RUN_MIGRATIONS: ${AUTO_MIGRATE:-true}
      RUN_SEEDERS: ${AUTO_SEED:-true}
    volumes:
      - api_vendor:/var/www/html/vendor
      - api_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      insightface-service:
        condition: service_healthy
    expose: ["9000"]
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s?0:1);'"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [guestbook]
    restart: unless-stopped

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      AI_SERVICE_URL: http://insightface-service:8000
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=120"]
    volumes:
      - api_vendor:/var/www/html/vendor
      - api_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
    networks: [guestbook]
    restart: unless-stopped

  scheduler:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - api_vendor:/var/www/html/vendor
      - api_storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
    networks: [guestbook]
    restart: unless-stopped

  insightface-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-change-me-ai-token}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-buffalo_l}
      AI_MODEL_VERSION: ${AI_MODEL_VERSION:-buffalo_l}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      AI_DETECTION_SIZE: ${AI_DETECTION_SIZE:-640}
      AI_MIN_FACE_SIZE: ${AI_MIN_FACE_SIZE:-80}
      AI_PROVIDERS: ${AI_PROVIDERS:-CPUExecutionProvider}
      INSIGHTFACE_HOME: /models
    ports:
      - "${AI_PORT:-8001}:8000"
    volumes:
      - insightface_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [guestbook]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guestbook}
      POSTGRES_USER: ${POSTGRES_USER:-guestbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guestbook} -d ${POSTGRES_DB:-guestbook}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [guestbook]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [guestbook]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [guestbook]
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      AWS_BUCKET: ${AWS_BUCKET:-guestbook}
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$AWS_BUCKET;
      mc anonymous set none local/$$AWS_BUCKET;
      exit 0;"
    networks: [guestbook]

networks:
  guestbook:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  insightface_models:
  api_vendor:
  api_storage:
